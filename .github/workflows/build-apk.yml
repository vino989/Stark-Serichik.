name: Build Stark Serichik APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Android project archive
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import io
          import zipfile
          from pathlib import Path

          folder = Path(".stark-source")
          parts = [folder / f"part{i:02}.b64" for i in range(6)]
          missing = [str(p) for p in parts if not p.is_file()]
          if missing:
              raise SystemExit(f"Missing archive parts: {missing}")
          encoded = "".join(p.read_text(encoding="ascii").strip() for p in parts)
          archive = base64.b64decode(encoded, validate=True)
          with zipfile.ZipFile(io.BytesIO(archive)) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"ZIP CRC check failed: {bad}")
              zf.extractall("android-project")
          print(f"Restored and verified {len(archive)} archive bytes")
          PY

      - name: Align Java and Kotlin bytecode targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android-project/app/build.gradle.kts")
          source = path.read_text(encoding="utf-8")
          needle = "    defaultConfig {"
          if "compileOptions {" not in source:
              if needle not in source:
                  raise SystemExit("Could not find defaultConfig in app/build.gradle.kts")
              patch = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

          """
              source = source.replace(needle, patch + needle, 1)
              path.write_text(source, encoding="utf-8")
          print("Configured Java source/target compatibility to JVM 17")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stark-serichik-debug-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
