name: Build Stark Serichik APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Android project archive
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import io
          import zipfile
          from pathlib import Path

          folder = Path(".stark-source")
          parts = [folder / f"part{i:02}.b64" for i in range(6)]
          missing = [str(p) for p in parts if not p.is_file()]
          if missing:
              raise SystemExit(f"Missing archive parts: {missing}")
          encoded = "".join(p.read_text(encoding="ascii").strip() for p in parts)
          archive = base64.b64decode(encoded, validate=True)
          with zipfile.ZipFile(io.BytesIO(archive)) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"ZIP CRC check failed: {bad}")
              zf.extractall("android-project")
          print(f"Restored and verified {len(archive)} archive bytes")

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stark-serichik-debug-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
